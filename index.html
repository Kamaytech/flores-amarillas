<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flores Amarillas 🌼</title>
  <meta name="description" content="21 de septiembre: un ramo de flores amarillas animadas para ti." />
  <meta property="og:title" content="Flores amarillas para ti 🌼" />
  <meta property="og:description" content="21 de septiembre: un ramo de flores amarillas animadas para ti." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌼</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-top: #0b1026;
      --sky-mid: #1b2350;
      --sky-low: #3a3566;
      --yellow: #ffd23f;
      --yellow-deep: #f5a300;
      --text: #fff8e1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 100%);
      color: var(--text);
      font-family: "Quicksand", system-ui, sans-serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ---------- Cielo ---------- */
    .moon {
      position: fixed;
      top: 7vh;
      right: 9vw;
      width: clamp(60px, 9vw, 110px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffbe6, #ffe9a8 60%, #f3cf73);
      box-shadow: 0 0 40px 10px rgba(255, 233, 160, .35), 0 0 120px 40px rgba(255, 220, 120, .15);
      animation: moonGlow 6s ease-in-out infinite alternate;
    }
    @keyframes moonGlow {
      to { box-shadow: 0 0 55px 16px rgba(255, 233, 160, .45), 0 0 160px 60px rgba(255, 220, 120, .2); }
    }

    .star {
      position: fixed;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: #fff;
      animation: twinkle ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }

    @media (max-aspect-ratio: 3/4) {
      .moon { top: 3vh; right: 6vw; width: 48px; }
    }

    /* ---------- Mensaje ---------- */
    .message {
      position: fixed;
      top: 9vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 720px);
      text-align: center;
      z-index: 5;
      pointer-events: none;
      padding: 0 16px;
    }
    .kicker {
      font-size: clamp(.8rem, 2.4vw, 1rem);
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--yellow);
      opacity: 0;
      animation: fadeUp 1.2s ease-out .6s forwards;
    }
    h1 {
      font-family: "Dancing Script", cursive;
      font-weight: 700;
      font-size: clamp(2.4rem, 9vw, 5rem);
      line-height: 1.05;
      margin: .3em 0 .25em;
      background: linear-gradient(90deg, #fff3b0, var(--yellow), #ffb703, var(--yellow), #fff3b0);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 210, 63, .35));
      opacity: 0;
      animation: fadeUp 1.4s ease-out 1.2s forwards, shine 6s linear 2.6s infinite;
    }
    .sub {
      font-size: clamp(.95rem, 3.2vw, 1.2rem);
      line-height: 1.5;
      opacity: 0;
      animation: fadeUp 1.4s ease-out 2.2s forwards;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .5);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shine { to { background-position: 200% center; } }

    .hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .85rem;
      color: rgba(255, 248, 225, .75);
      z-index: 5;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      animation: hint 7s ease-in-out 5s forwards;
    }
    @keyframes hint {
      0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; }
    }

    /* ---------- Jardín (SVG) ---------- */
    #garden {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .stem {
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: grow 1.6s ease-out forwards;
    }
    @keyframes grow { to { stroke-dashoffset: 0; } }

    .leaf, .petal, .core, .halo {
      transform-box: fill-box;
      transform: scale(0);
      animation: pop .9s cubic-bezier(.3, 1.6, .5, 1) forwards;
    }
    .leaf  { transform-origin: 0% 50%; }
    .petal { transform-origin: 50% 100%; }
    .core, .halo { transform-origin: 50% 50%; }
    .halo  { animation-name: pop, pulse; animation-duration: .9s, 3s; animation-timing-function: ease-out, ease-in-out; animation-iteration-count: 1, infinite; animation-direction: normal, alternate; }
    @keyframes pop { to { transform: scale(1); } }
    @keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.15); opacity: .55; } }

    .flower { animation: sway ease-in-out infinite alternate; }
    @keyframes sway {
      from { transform: rotate(-2.2deg); }
      to   { transform: rotate(2.2deg); }
    }

    .head-spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Pétalos que caen y luciérnagas ---------- */
    .falling {
      position: fixed;
      top: -30px;
      z-index: 4;
      pointer-events: none;
      border-radius: 80% 0 80% 0;
      background: radial-gradient(circle at 30% 30%, #fff1a6, var(--yellow) 55%, var(--yellow-deep));
      animation: fall linear forwards;
    }
    @keyframes fall {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      8%   { opacity: 1; }
      25%  { transform: translate(calc(var(--dx) * .6), 25vh) rotate(160deg); }
      50%  { transform: translate(calc(var(--dx) * -.2), 50vh) rotate(320deg); }
      75%  { transform: translate(var(--dx), 75vh) rotate(480deg); }
      92%  { opacity: 1; }
      100% { transform: translate(calc(var(--dx) * .3), 105vh) rotate(640deg); opacity: 0; }
    }

    .firefly {
      position: fixed;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #fff6b0;
      box-shadow: 0 0 8px 3px rgba(255, 230, 110, .8);
      z-index: 3;
      pointer-events: none;
      animation: drift ease-in-out infinite alternate, blink ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(var(--fx), var(--fy)); }
    }
    @keyframes blink { from { opacity: .1; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .flower, .firefly, .star, .head-spin, h1 { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
      .falling { display: none; }
    }
  </style>
</head>
<body>
  <div class="moon" aria-hidden="true"></div>

  <main class="message">
    <p class="kicker">21 de septiembre</p>
    <h1 id="title">Flores amarillas para ti</h1>
    <p class="sub" id="sub">Dicen que hoy se regalan flores amarillas…<br />así que aquí están las tuyas 💛</p>
  </main>

  <svg id="garden" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" aria-label="Jardín de flores amarillas animadas">
    <defs>
      <radialGradient id="petalOuter" cx="50%" cy="100%" r="100%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="55%" stop-color="#ffc300" />
        <stop offset="100%" stop-color="#ffe066" />
      </radialGradient>
      <radialGradient id="petalInner" cx="50%" cy="100%" r="100%">
        <stop offset="0%" stop-color="#ffb000" />
        <stop offset="60%" stop-color="#ffd84d" />
        <stop offset="100%" stop-color="#fff3a3" />
      </radialGradient>
      <radialGradient id="centerGrad" cx="40%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#a0621c" />
        <stop offset="60%" stop-color="#6b3a10" />
        <stop offset="100%" stop-color="#3d1f06" />
      </radialGradient>
      <radialGradient id="glow">
        <stop offset="0%" stop-color="rgba(255,215,80,.55)" />
        <stop offset="100%" stop-color="rgba(255,215,80,0)" />
      </radialGradient>
      <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1f4d2e" />
        <stop offset="100%" stop-color="#0f2618" />
      </linearGradient>
      <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2d6a3a" />
        <stop offset="100%" stop-color="#143821" />
      </linearGradient>
      <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#2f7d32" />
        <stop offset="100%" stop-color="#6cc04a" />
      </linearGradient>
    </defs>
    <g id="scene"></g>
  </svg>

  <p class="hint">✨ Toca la pantalla para plantar más flores ✨</p>

  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("garden");
      const scene = document.getElementById("scene");
      const rand = (a, b) => a + Math.random() * (b - a);
      let W, H, frontLayer, planted = 0;

      // Personalización opcional: index.html?para=Ana&msg=Te%20quiero
      const params = new URLSearchParams(location.search);
      const para = params.get("para");
      const msg = params.get("msg");
      if (para) document.getElementById("title").textContent = "Flores amarillas para " + para.slice(0, 40);
      if (msg) document.getElementById("sub").textContent = msg.slice(0, 160);

      function el(tag, attrs, parent) {
        const node = document.createElementNS(NS, tag);
        for (const k in attrs) node.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(node);
        return node;
      }

      // Punto sobre una curva cuadrática de Bézier
      function quad(p0, p1, p2, t) {
        const u = 1 - t;
        return {
          x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
          y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y,
        };
      }

      function petalPath(len, w) {
        return `M0 0 C ${-w} ${-len * 0.3}, ${-w * 0.8} ${-len * 0.9}, 0 ${-len} C ${w * 0.8} ${-len * 0.9}, ${w} ${-len * 0.3}, 0 0 Z`;
      }

      function makeFlower(parent, x, baseY, h, s, delay) {
        const grow = 1.6;
        const g = el("g", { class: "flower" }, parent);
        g.style.transformOrigin = `${x}px ${baseY}px`;
        g.style.animationDuration = rand(3.5, 6.5) + "s";
        g.style.animationDelay = -rand(0, 6) + "s";

        // Tallo
        const p0 = { x, y: baseY };
        const p2 = { x: x + rand(-0.12, 0.12) * h, y: baseY - h };
        const p1 = { x: x + rand(-0.25, 0.25) * h, y: baseY - h * 0.5 };
        const stem = el("path", {
          d: `M${p0.x} ${p0.y} Q ${p1.x} ${p1.y} ${p2.x} ${p2.y}`,
          class: "stem",
          pathLength: 1,
          stroke: "#3e8e3a",
          "stroke-width": Math.max(2, 4.5 * s),
        }, g);
        stem.style.animationDelay = delay + "s";

        // Hojas
        const leafTs = [rand(0.25, 0.4), rand(0.5, 0.65)];
        leafTs.forEach((t, i) => {
          const pt = quad(p0, p1, p2, t);
          const side = i % 2 === 0 ? 1 : -1;
          const L = rand(26, 38) * s;
          const holder = el("g", {
            transform: `translate(${pt.x} ${pt.y}) rotate(${side > 0 ? rand(-40, -20) : rand(200, 220)})`,
          }, g);
          const leaf = el("path", {
            d: `M0 0 Q ${L * 0.5} ${-L * 0.45} ${L} 0 Q ${L * 0.5} ${L * 0.32} 0 0 Z`,
            class: "leaf",
            fill: "url(#leafGrad)",
          }, holder);
          leaf.style.animationDelay = delay + grow * t + "s";
        });

        // Cabeza de la flor
        const R = rand(22, 30) * s;
        const bloom = delay + grow - 0.15;
        const head = el("g", { transform: `translate(${p2.x} ${p2.y})` }, g);

        const halo = el("circle", { r: R * 1.9, fill: "url(#glow)", class: "halo" }, head);
        halo.style.animationDelay = bloom + "s, " + (bloom + 1) + "s";

        const spin = el("g", { class: "head-spin" }, head);
        spin.style.animationDuration = rand(30, 60) + "s";

        const outer = 16, inner = 12;
        for (let i = 0; i < outer; i++) {
          const rot = el("g", { transform: `rotate(${(360 / outer) * i})` }, spin);
          const p = el("path", { d: petalPath(R, R * 0.3), fill: "url(#petalOuter)", class: "petal" }, rot);
          p.style.animationDelay = bloom + i * 0.035 + "s";
        }
        const off = 180 / inner;
        for (let i = 0; i < inner; i++) {
          const rot = el("g", { transform: `rotate(${(360 / inner) * i + off})` }, spin);
          const p = el("path", { d: petalPath(R * 0.72, R * 0.26), fill: "url(#petalInner)", class: "petal" }, rot);
          p.style.animationDelay = bloom + 0.35 + i * 0.035 + "s";
        }

        const core = el("g", { class: "core" }, spin);
        core.style.animationDelay = bloom + 0.6 + "s";
        const cr = R * 0.36;
        el("circle", { r: cr, fill: "url(#centerGrad)" }, core);
        // semillas en espiral (ángulo áureo)
        for (let i = 1; i < 22; i++) {
          const a = i * 137.5 * Math.PI / 180;
          const d = cr * 0.85 * Math.sqrt(i / 22);
          el("circle", {
            cx: Math.cos(a) * d, cy: Math.sin(a) * d,
            r: Math.max(0.6, cr * 0.07),
            fill: i % 3 ? "#2b1604" : "#c98a2b", opacity: 0.8,
          }, core);
        }
        return g;
      }

      function hill(yLeft, yMid, yRight, fill, parent) {
        el("path", {
          d: `M0 ${yLeft} Q ${W * 0.25} ${yMid - H * 0.05} ${W * 0.5} ${yMid} T ${W} ${yRight} L ${W} ${H * 1.5} L 0 ${H * 1.5} Z`,
          fill,
        }, parent);
      }

      function build() {
        W = window.innerWidth;
        H = window.innerHeight;
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        scene.innerHTML = "";
        planted = 0;

        const unit = Math.min(W, H) / 700;       // escala según pantalla
        const portrait = H > W;

        // Fila de atrás
        const back = el("g", { opacity: 0.85 }, scene);
        const nBack = Math.max(5, Math.min(14, Math.round(W / 110)));
        for (let i = 0; i < nBack; i++) {
          const x = (W / nBack) * (i + 0.5) + rand(-20, 20);
          const h = H * rand(portrait ? 0.3 : 0.28, portrait ? 0.42 : 0.4);
          makeFlower(back, x, H * 0.9, h, 0.75 * unit + 0.25, 0.3 + i * 0.12 + rand(0, 0.3));
        }
        hill(H * 0.86, H * 0.88, H * 0.85, "url(#hillBack)", scene);

        // Fila de adelante
        frontLayer = el("g", {}, scene);
        const nFront = Math.max(4, Math.min(11, Math.round(W / 140)));
        for (let i = 0; i < nFront; i++) {
          const x = (W / nFront) * (i + 0.5) + rand(-25, 25);
          const h = H * rand(portrait ? 0.24 : 0.22, portrait ? 0.36 : 0.34);
          makeFlower(frontLayer, x, H * 1.0, h, unit + 0.35, 1 + i * 0.15 + rand(0, 0.3));
        }
        hill(H * 0.95, H * 0.97, H * 0.94, "url(#hillFront)", scene);
        // la fila frontal se dibuja sobre la colina
        scene.appendChild(frontLayer);
      }

      // Plantar flores al tocar
      document.addEventListener("pointerdown", (e) => {
        if (!frontLayer || planted > 40) return;
        planted++;
        const unit = Math.min(W, H) / 700;
        const baseY = H * rand(0.97, 1.0);
        const maxH = Math.max(80, baseY - e.clientY);
        const h = Math.min(maxH, H * rand(0.18, 0.3));
        makeFlower(frontLayer, e.clientX, baseY, h, unit * rand(0.8, 1.05) + 0.3, 0);
        burst(e.clientX, e.clientY);
      });

      // Pequeña lluvia de pétalos donde se toca
      function burst(x, y) {
        for (let i = 0; i < 6; i++) {
          const p = document.createElement("div");
          p.className = "falling";
          const size = rand(8, 13);
          p.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size * 1.4}px;--dx:${rand(-60, 60)}px;animation-duration:${rand(3, 5)}s`;
          document.body.appendChild(p);
          p.addEventListener("animationend", () => p.remove());
        }
      }

      // Estrellas
      function stars() {
        const n = Math.round((window.innerWidth * window.innerHeight) / 9000);
        for (let i = 0; i < n; i++) {
          const s = document.createElement("div");
          s.className = "star";
          const size = rand(1, 2.6);
          s.style.cssText = `left:${rand(0, 100)}vw;top:${rand(0, 60)}vh;width:${size}px;height:${size}px;animation-duration:${rand(1.5, 4)}s;animation-delay:${-rand(0, 4)}s`;
          document.body.appendChild(s);
        }
      }

      // Luciérnagas
      function fireflies() {
        for (let i = 0; i < 22; i++) {
          const f = document.createElement("div");
          f.className = "firefly";
          f.style.cssText = `left:${rand(0, 100)}vw;top:${rand(35, 95)}vh;--fx:${rand(-80, 80)}px;--fy:${rand(-60, 60)}px;animation-duration:${rand(5, 10)}s,${rand(1.2, 3)}s;animation-delay:${-rand(0, 10)}s,${-rand(0, 3)}s`;
          document.body.appendChild(f);
        }
      }

      // Pétalos cayendo del cielo
      function fallingPetal() {
        const p = document.createElement("div");
        p.className = "falling";
        const size = rand(9, 16);
        p.style.cssText = `left:${rand(0, 100)}vw;width:${size}px;height:${size * 1.4}px;--dx:${rand(-120, 120)}px;animation-duration:${rand(7, 13)}s`;
        document.body.appendChild(p);
        p.addEventListener("animationend", () => p.remove());
      }

      build();
      stars();
      fireflies();
      setTimeout(() => setInterval(fallingPetal, 650), 3000);

      let t;
      let lastW = window.innerWidth;
      window.addEventListener("resize", () => {
        clearTimeout(t);
        t = setTimeout(() => {
          // evitar reconstruir por la barra del navegador en móviles
          if (Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; build(); }
        }, 250);
      });
    })();
  </script>
</body>
</html>
